<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Subtle gloss overlay -->
  <rect width="512" height="260" rx="112" fill="url(#glow)"/>
  <!-- Decorative circles -->
  <circle cx="430" cy="95"  r="180" fill="rgba(255,255,255,0.05)"/>
  <circle cx="70"  cy="420" r="140" fill="rgba(0,0,0,0.08)"/>

  <!-- Wallet body -->
  <rect x="96" y="178" width="320" height="210" rx="26" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.9)" stroke-width="18"/>
  <!-- Wallet top seam -->
  <line x1="96" y1="238" x2="416" y2="238" stroke="rgba(255,255,255,0.4)" stroke-width="14"/>
  <!-- Coin pocket -->
  <rect x="278" y="252" width="122" height="90" rx="18" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.85)" stroke-width="14"/>
  <!-- Coin in pocket -->
  <circle cx="339" cy="297" r="22" fill="white" opacity="0.95"/>
  <!-- Rupee symbol on coin -->
  <text x="339" y="305" font-family="'Segoe UI',Arial,sans-serif" font-size="24" font-weight="900"
        text-anchor="middle" fill="#7c3aed">₹</text>

  <!-- Card slots in wallet -->
  <rect x="112" y="255" width="145" height="12" rx="6" fill="rgba(255,255,255,0.45)"/>
  <rect x="112" y="279" width="110" height="12" rx="6" fill="rgba(255,255,255,0.28)"/>
  <rect x="112" y="303" width="128" height="12" rx="6" fill="rgba(255,255,255,0.18)"/>

  <!-- Bottom strap of wallet -->
  <rect x="160" y="140" width="38" height="52" rx="10" fill="rgba(255,255,255,0.7)"/>
  <rect x="314" y="140" width="38" height="52" rx="10" fill="rgba(255,255,255,0.7)"/>
</svg>
